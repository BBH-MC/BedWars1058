name: Deploy with Maven

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      # The release version used to be handed out by an external API and the
      # artifacts pushed to an external maven/javadoc host. Both are gone, so the
      # version now comes from the root pom. Configure distributionManagement and
      # restore `mvn deploy` here if you want to publish artifacts again.
      - name: Build with Maven
        run: |
          sudo apt install jq -y
          export UPDATE_VERSION=`mvn -q help:evaluate -Dexpression=project.version -DforceStdout`
          mvn clean install -s ci_settings.xml
          mvn javadoc:javadoc
          echo "UPDATE_VERSION=$UPDATE_VERSION" >> $GITHUB_ENV

      - name: Create Tag
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          name: ${{env.UPDATE_VERSION}}
          tag_name: ${{env.UPDATE_VERSION}}
