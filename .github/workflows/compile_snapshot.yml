name: Compile snapshot with Maven

on:
  push:
    branches-ignore:
      - develop
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile with Maven
        run: |
          mvn clean install -s ci_settings.xml
