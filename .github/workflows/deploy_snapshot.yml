name: Deploy snapshot with Maven

on:
  push:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      # The snapshot repository this used to publish to is gone. Configure
      # distributionManagement in the root pom and restore `mvn deploy` here.
      - name: Build snapshot with Maven
        env:
          MVN_REPO_USER: ${{ secrets.MVN_REPO_USER }}
          MVN_REPO_PASS: ${{ secrets.MVN_REPO_PASS }}
        run: |
          mvn clean install -s ci_settings.xml
